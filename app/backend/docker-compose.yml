version: "3.8"

services:
  # local postgres for testing — mirrors our cloud setup
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nexcloud
      POSTGRES_USER: nexcloud_app
      POSTGRES_PASSWORD: testpassword123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexcloud_app -d nexcloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  # local redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # our backend app
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nexcloud_app:testpassword123@postgres:5432/nexcloud
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started