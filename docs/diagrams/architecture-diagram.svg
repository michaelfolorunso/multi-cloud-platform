<svg width="680" height="680" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="680" fill="#ffffff"/>

<!-- CI/CD top bar -->
<g>
  <rect x="190" y="20" width="300" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">GitHub Actions</text>
  <text x="340" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">build, push, deploy on every push</text>
</g>

<path d="M260 76 L260 100 L150 100 L150 124" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M420 76 L420 100 L530 100 L530 124" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- AWS outer container -->
<g>
  <rect x="30" y="130" width="270" height="330" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="50" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">AWS</text>
  <text x="50" y="176" font-family="Arial, sans-serif" font-size="12" fill="#712B13">EKS, 3 availability zones</text>
</g>

<g>
  <rect x="50" y="195" width="230" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="165" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#412402">Public subnet</text>
  <text x="165" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#633806">NAT gateway, load balancer</text>
</g>

<path d="M165 255 L165 270" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="50" y="276" width="230" height="100" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="165" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Private subnet</text>
  <text x="165" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">EKS nodes, RDS Postgres</text>
  <text x="165" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">IRSA / OIDC pod auth</text>
  <text x="165" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">no static AWS keys</text>
</g>

<g>
  <rect x="50" y="388" width="105" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="102" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A">ECR</text>
  <text x="102" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">image registry</text>
</g>
<g>
  <rect x="175" y="388" width="105" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="227" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A">Secrets Manager</text>
  <text x="227" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">DB credentials</text>
</g>

<!-- GCP outer container -->
<g>
  <rect x="380" y="130" width="270" height="330" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="400" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">GCP</text>
  <text x="400" y="176" font-family="Arial, sans-serif" font-size="12" fill="#085041">GKE, multi-zone regional</text>
</g>

<g>
  <rect x="400" y="195" width="230" height="180" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="515" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">GKE subnet</text>
  <text x="515" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">cluster spans 3 zones</text>
  <text x="515" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">automatically</text>
  <text x="515" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">Cloud SQL Postgres</text>
  <text x="515" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">private IP only</text>
  <text x="515" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">Workload Identity</text>
  <text x="515" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">no static GCP keys</text>
</g>

<g>
  <rect x="400" y="388" width="105" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="452" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A">Artifact Registry</text>
  <text x="452" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">image registry</text>
</g>
<g>
  <rect x="525" y="388" width="105" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="577" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A">Secret Manager</text>
  <text x="577" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">DB credentials</text>
</g>

<!-- App layer -->
<path d="M165 460 L165 480 L340 480" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M515 460 L515 480 L340 480" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="170" y="486" width="340" height="80" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">TaskFlow Pro</text>
  <text x="340" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">same app, same image, running on both clouds</text>
  <text x="340" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">React, FastAPI, Postgres, Redis worker</text>
</g>

<!-- Monitoring -->
<path d="M340 566 L340 586" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="140" y="592" width="400" height="68" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#042C53">Observability</text>
  <text x="340" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">Prometheus, Grafana, Alertmanager to Slack</text>
</g>

</svg>
