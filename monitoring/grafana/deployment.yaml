# The admin password lives in a Secret, not hardcoded in the Deployment.
# Anyone with read access to the repo should never see a credential.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: monitoring
type: Opaque
stringData:
  admin-password: "nexcloud2026"

---
# Provisioning datasources via a mounted config file is the supported Grafana API.
# The GF_DATASOURCES_DEFAULT_* env vars are undocumented and break across versions.
# This approach survives pod restarts and Grafana upgrades without manual UI intervention.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # Cross-namespace DNS — Grafana is in monitoring, Prometheus service is also
        # in monitoring, so the short name resolves. If they were in different
        # namespaces we'd need the FQDN: prometheus-service.monitoring.svc.cluster.local
        url: http://prometheus-service:9090
        isDefault: true
        editable: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  # Missing from original — without this it lands in default namespace
  # while the Service is in monitoring and they never find each other
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # Grafana's official image runs as uid 472 — match it here so the
      # storage volume is writable without chmod hacks
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          # Pin the version — dashboards and provisioning configs can break
          # silently between minor Grafana releases
          image: grafana/grafana:10.4.2
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Disable telemetry — Grafana phones home by default
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            # Provisioning directory — Grafana watches this on startup and
            # automatically configures any datasources it finds here
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources

---
# LoadBalancer gives Grafana a public IP so you can reach the UI from a browser.
# Prometheus stays ClusterIP — only Grafana needs to be externally accessible.
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
      name: http
  type: LoadBalancer
