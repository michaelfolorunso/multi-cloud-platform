name: Build and Deploy NexCloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  GCP_PROJECT: nexcloud-platform
  GCP_REGION: us-central1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      worker: ${{ steps.changes.outputs.worker }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check which services changed
        id: changes
        run: |
          BACKEND=$(git diff --name-only HEAD~1 HEAD | grep 'app/backend' | wc -l | tr -d ' ')
          FRONTEND=$(git diff --name-only HEAD~1 HEAD | grep 'app/frontend' | wc -l | tr -d ' ')
          WORKER=$(git diff --name-only HEAD~1 HEAD | grep 'app/worker' | wc -l | tr -d ' ')
          echo "backend=$BACKEND" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          echo "worker=$WORKER" >> $GITHUB_OUTPUT
          echo "Changed files:"
          git diff --name-only HEAD~1 HEAD

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: detect-changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: needs.detect-changes.outputs.backend != '0'
        run: |
          docker buildx build --platform linux/amd64 \
            --cache-from ${{ steps.login-ecr.outputs.registry }}/nexcloud-backend:latest \
            --cache-to type=inline \
            -t ${{ steps.login-ecr.outputs.registry }}/nexcloud-backend:${{ env.IMAGE_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/nexcloud-backend:latest \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/nexcloud/backend:${{ env.IMAGE_TAG }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/nexcloud/backend:latest \
            --push \
            app/backend

      - name: Build and push frontend
        if: needs.detect-changes.outputs.frontend != '0'
        run: |
          docker buildx build --platform linux/amd64 \
            --cache-from ${{ steps.login-ecr.outputs.registry }}/nexcloud-frontend:latest \
            --cache-to type=inline \
            -t ${{ steps.login-ecr.outputs.registry }}/nexcloud-frontend:${{ env.IMAGE_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/nexcloud-frontend:latest \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/nexcloud/frontend:${{ env.IMAGE_TAG }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/nexcloud/frontend:latest \
            --push \
            app/frontend

      - name: Build and push worker
        if: needs.detect-changes.outputs.worker != '0'
        run: |
          docker buildx build --platform linux/amd64 \
            --cache-from ${{ steps.login-ecr.outputs.registry }}/nexcloud-worker:latest \
            --cache-to type=inline \
            -t ${{ steps.login-ecr.outputs.registry }}/nexcloud-worker:${{ env.IMAGE_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/nexcloud-worker:latest \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/nexcloud/worker:${{ env.IMAGE_TAG }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/nexcloud/worker:latest \
            --push \
            app/worker

  deploy-gke:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: nexcloud-gke-dev
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT }}

      - name: Create Kubernetes secrets GKE
        run: |
          kubectl create secret generic nexcloud-secrets \
            --from-literal=DATABASE_URL=${{ secrets.GKE_DATABASE_URL }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags in GKE manifests
        run: |
          sed -i "s|nexcloud/backend:latest|nexcloud/backend:${{ env.IMAGE_TAG }}|g" kubernetes/gke/backend-deployment.yaml
          sed -i "s|nexcloud/frontend:latest|nexcloud/frontend:${{ env.IMAGE_TAG }}|g" kubernetes/gke/frontend-deployment.yaml
          sed -i "s|nexcloud/worker:latest|nexcloud/worker:${{ env.IMAGE_TAG }}|g" kubernetes/gke/worker-deployment.yaml

      - name: Deploy to GKE
        run: |
          kubectl apply -f kubernetes/manifests/configmap.yaml
          kubectl apply -f kubernetes/manifests/backend-service.yaml
          kubectl apply -f kubernetes/manifests/frontend-service.yaml
          kubectl apply -f kubernetes/gke/backend-deployment.yaml
          kubectl apply -f kubernetes/gke/frontend-deployment.yaml
          kubectl apply -f kubernetes/gke/worker-deployment.yaml
          kubectl rollout status deployment/frontend --timeout=300s || true
          kubectl rollout status deployment/worker --timeout=300s || true
          kubectl rollout status deployment/backend --timeout=600s || true

  deploy-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EKS credentials
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name nexcloud-eks-dev

      - name: Create Kubernetes secrets EKS
        run: |
          kubectl create secret generic nexcloud-secrets \
            --from-literal=DATABASE_URL=${{ secrets.EKS_DATABASE_URL }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags in EKS manifests
        run: |
          sed -i "s|nexcloud-backend:latest|nexcloud-backend:${{ env.IMAGE_TAG }}|g" kubernetes/eks/backend-deployment.yaml
          sed -i "s|nexcloud-frontend:latest|nexcloud-frontend:${{ env.IMAGE_TAG }}|g" kubernetes/eks/frontend-deployment.yaml
          sed -i "s|nexcloud-worker:latest|nexcloud-worker:${{ env.IMAGE_TAG }}|g" kubernetes/eks/worker-deployment.yaml

      - name: Deploy to EKS
        run: |
          kubectl apply -f kubernetes/manifests/configmap.yaml
          kubectl apply -f kubernetes/manifests/backend-service.yaml
          kubectl apply -f kubernetes/manifests/frontend-service.yaml
          kubectl apply -f kubernetes/eks/backend-deployment.yaml
          kubectl apply -f kubernetes/eks/frontend-deployment.yaml
          kubectl apply -f kubernetes/eks/worker-deployment.yaml
          kubectl rollout status deployment/frontend --timeout=300s || true
          kubectl rollout status deployment/worker --timeout=300s || true
          kubectl rollout status deployment/backend --timeout=600s || true